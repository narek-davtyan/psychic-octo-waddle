name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SafeVault.slnx

      - name: Build (warnings are errors)
        run: dotnet build SafeVault.slnx --no-restore -c Release

      - name: Test
        run: dotnet test SafeVault.slnx --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Check for known vulnerable packages
        run: dotnet list SafeVault.slnx package --vulnerable --include-transitive
